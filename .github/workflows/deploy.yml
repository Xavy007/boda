name: CI y deploy a Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck y build
    runs-on: ubuntu-latest
    env:
      # Solo para que Prisma genere el cliente; el build no se conecta a la base
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy a Render
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL (GitHub → Settings → Secrets and variables → Actions). No se desplegó nada."
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Respuesta de Render (HTTP $status): $body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Render rechazó el deploy hook (HTTP $status). Revisa que la URL del secret sea la del servicio correcto."
            exit 1
          fi
          echo "::notice::✅ Deploy solicitado a Render. Mira el progreso en dashboard.render.com → invitacion-boda → Events."
